<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Sara Shafqat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e0715"/>
      <stop offset="0.55" stop-color="#7b1e3a">
        <animate attributeName="offset" values="0.4;0.72;0.4" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#b83a5a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="270" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="270" fill="url(#bg)"/>

    <!-- drifting soft circles -->
    <circle cx="840" cy="70" r="130" fill="#f6e7e9" opacity="0.06">
      <animate attributeName="cy" values="70;105;70" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="230" r="90" fill="#f6e7e9" opacity="0.05">
      <animate attributeName="cy" values="230;200;230" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="250" r="60" fill="#e0607e" opacity="0.10">
      <animate attributeName="cx" values="640;680;640" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- slowly rotating dashed rings -->
    <g transform="translate(790 135)">
      <circle r="92" fill="none" stroke="#f6e7e9" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle r="62" fill="none" stroke="#e0607e" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="40 14">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#f6e7e9" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name -->
    <text x="70" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#f6e7e9" opacity="0">
      Sara Shafqat
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="1.2s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- growing underline -->
    <rect x="70" y="144" width="0" height="2.5" fill="#e0607e">
      <animate attributeName="width" from="0" to="190" dur="1.4s" begin="0.8s" fill="freeze"/>
    </rect>

    <!-- tagline -->
    <text x="70" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="4" fill="#ecc9d1" opacity="0">
      I CODE.   I DESIGN.   I ORGANISE.   I TEACH.
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1.4s" fill="freeze"/>
    </text>

    <!-- role line -->
    <text x="70" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5" fill="#c9a3ad" opacity="0">
      BBIT GRADUATE  |  IT AND BUSINESS OPERATIONS  |  UX/UI  |  WEB
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="2s" fill="freeze"/>
    </text>
  </g>
</svg>
