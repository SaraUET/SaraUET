<circle cx="175" cy="195" r="91" fill="#3C0A1F" stroke="#E64E91" stroke-width="2.5"/>
<circle cx="175" cy="195" r="80" fill="none" stroke="#F3B2CA" stroke-opacity=".6" stroke-dasharray="3 8"/>
<circle cx="175" cy="195" r="70" fill="#17050D"/>
<text x="175" y="220" text-anchor="middle" class="heading" font-size="75">S.</text>
<text x="175" y="315" text-anchor="middle" class="muted" font-size="10" letter-spacing="2">YOUR PORTRAIT</text>

