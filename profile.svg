
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1660" viewBox="0 0 1000 1660">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090207"/>
    <stop offset=".5" stop-color="#190611"/>
    <stop offset="1" stop-color="#31091C"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#250817"/>
    <stop offset="1" stop-color="#10040B"/>
  </linearGradient>
  <linearGradient id="pink">
    <stop stop-color="#A51E50"/>
    <stop offset=".5" stop-color="#E64E91"/>
    <stop offset="1" stop-color="#F5B5D0"/>
  </linearGradient>
  <radialGradient id="mist">
    <stop stop-color="#C82D70" stop-opacity=".34"/>
    <stop offset="1" stop-color="#C82D70" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="smoke">
    <feGaussianBlur stdDeviation="17"/>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#D84C80" stroke-opacity=".10"/>
  </pattern>
  <style>
    .heading{font-family:Georgia,serif;fill:#FBEAF1}
    .mono{font-family:monospace;fill:#F3B2CA}
    .muted{font-family:monospace;fill:#B9869B}
    .pink{fill:#E64E91}
    .line{stroke:#D84C80;stroke-opacity:.65;fill:none}
    .panel{fill:url(#panel);stroke:#A52B59;stroke-opacity:.75}
  </style>
</defs>

<!-- BACKGROUND -->
<rect width="1000" height="1660" fill="url(#bg)"/>
<rect width="1000" height="1660" fill="url(#grid)"/>

<!-- ATMOSPHERIC SMOKE -->
<g filter="url(#smoke)" opacity=".75">
  <ellipse cx="90" cy="110" rx="170" ry="100" fill="#7D173B" opacity=".35"/>
  <ellipse cx="890" cy="300" rx="180" ry="120" fill="#D12B70" opacity=".18"/>
  <ellipse cx="70" cy="800" rx="160" ry="180" fill="#8B1648" opacity=".19"/>
  <ellipse cx="940" cy="1100" rx="170" ry="150" fill="#B51D5C" opacity=".18"/>
  <ellipse cx="500" cy="1580" rx="300" ry="100" fill="#8A1647" opacity=".22"/>
</g>

<ellipse cx="800" cy="160" rx="300" ry="240" fill="url(#mist)"/>
<ellipse cx="130" cy="650" rx="230" ry="300" fill="url(#mist)"/>

<!-- DECORATIVE FRAME -->
<rect x="16" y="16" width="968" height="1628" rx="24" fill="none" stroke="#D84C80" stroke-opacity=".55"/>
<rect x="23" y="23" width="954" height="1614" rx="20" fill="none" stroke="#F3B2CA" stroke-opacity=".13"/>

<!-- ORNAMENTAL CORNER LINES -->
<g class="line" stroke-width="1.3">
  <path d="M35 110V45H115 M885 45H965V110"/>
  <path d="M35 1550V1615H115 M885 1615H965V1550"/>
  <path d="M35 120Q70 80 105 120 M895 120Q930 80 965 120"/>
</g>

<!-- STARS -->
<g fill="#F3B2CA" filter="url(#glow)">
  <path d="M875 95l5 15 15 5-15 5-5 15-5-15-15-5 15-5z"/>
  <path d="M140 320l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
  <path d="M920 650l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
  <path d="M75 1100l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
  <path d="M850 1450l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
</g>
<g fill="#FBEAF1" opacity=".8">
  <circle cx="230" cy="80" r="2"/><circle cx="790" cy="260" r="2"/>
  <circle cx="940" cy="440" r="2"/><circle cx="100" cy="900" r="2"/>
  <circle cx="870" cy="1200" r="2"/><circle cx="350" cy="1520" r="2"/>
</g>

<!-- BUTTERFLY ILLUSTRATION -->
<g transform="translate(840 185)" filter="url(#glow)">
  <path d="M0 0 C-45 -100 -125 -80 -92 -10 C-73 30 -32 25 0 0
           C32 25 73 30 92 -10 C125 -80 45 -100 0 0Z"
        fill="#D84C80" fill-opacity=".13" stroke="#F3B2CA" stroke-width="1.6"/>
  <path d="M0 0 C-55 -50 -92 -48 -82 -12 C-67 15 -35 18 0 0
           C55 -50 92 -48 82 -12 C67 15 35 18 0 0Z"
        fill="#7D173B" fill-opacity=".4" stroke="#D84C80"/>
  <path d="M0 0 C-30 35 -45 85 -10 60 L0 0
           C30 35 45 85 10 60Z"
        fill="#A51E50" stroke="#F3B2CA" stroke-width="1.2"/>
  <path d="M-3 -8Q-25 -50 -43 -55 M3 -8Q25 -50 43 -55"
        fill="none" stroke="#F3B2CA"/>
  <path d="M0 -4V45" stroke="#FBEAF1" stroke-width="2"/>
</g>

<!-- HERO PANEL -->
<rect x="45" y="55" width="910" height="300" rx="22" class="panel"/>
<rect x="45" y="55" width="910" height="300" rx="22" fill="url(#grid)"/>
<rect x="45" y="55" width="910" height="300" rx="22" fill="none" stroke="#E64E91" stroke-opacity=".35" filter="url(#glow)"/>

