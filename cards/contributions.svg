<svg xmlns="http://www.w3.org/2000/svg"
        width="1000"
        height="190"
        viewBox="0 0 1000 190"
        role="img">

<defs>

  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10030A"/>
    <stop offset=".55" stop-color="#1B0610"/>
    <stop offset="1" stop-color="#31091C"/>
  </linearGradient>

  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7D173B"/>
    <stop offset=".55" stop-color="#D84C80"/>
    <stop offset="1" stop-color="#F3B2CA"/>
  </linearGradient>

  <radialGradient id="mist">
    <stop offset="0" stop-color="#D84C80" stop-opacity=".32"/>
    <stop offset="1" stop-color="#D84C80" stop-opacity="0"/>
  </radialGradient>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="smoke">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <pattern id="grid" width="28" height="28"
           patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28"
          fill="none"
          stroke="#D84C80"
          stroke-opacity=".09"/>
  </pattern>

  <style>
    .heading {
      font-family: Georgia, serif;
      fill: #FBEAF1;
    }

    .mono {
      font-family: monospace;
      fill: #F3B2CA;
    }

    .muted {
      font-family: monospace;
      fill: #B9869B;
    }

    .pink {
      fill: #D84C80;
    }

    .line {
      stroke: #D84C80;
      stroke-opacity: .65;
      fill: none;
    }
  </style>

</defs>

<title>Contribution history</title>

<rect width="100%" height="100%" rx="22"
      fill="url(#background)"/>

<rect width="100%" height="100%" rx="22"
      fill="url(#grid)"/>

<!-- ATMOSPHERIC SMOKE -->

<g filter="url(#smoke)" opacity=".55">

  <ellipse cx="8%" cy="15%" rx="20%" ry="28%"
           fill="#7D173B" opacity=".5"/>

  <ellipse cx="90%" cy="80%" rx="24%" ry="30%"
           fill="#D84C80" opacity=".18"/>

</g>

<!-- PINK MIST -->

<ellipse cx="85%" cy="15%" rx="28%" ry="40%"
         fill="url(#mist)"/>

<!-- GLOWING BORDER -->

<rect x="1" y="1"
      width="98%" height="98%"
      rx="21"
      fill="none"
      stroke="#D84C80"
      stroke-opacity=".65"/>

<!-- DECORATIVE STARS -->

<g fill="#F3B2CA" filter="url(#glow)">

  <path d="M88 30l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>

  <path d="M90 75l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>

</g>


    <text x="30" y="40"
          class="pink mono"
          font-size="12"
          letter-spacing="3">
      05 / CONTRIBUTION HISTORY
    </text>

    <text x="30" y="88"
          class="heading"
          font-size="30">
      A year of little steps.
    </text>

    <path d="M30 105H410"
          class="line"/>
    
        <text x="30" y="135"
              class="muted"
              font-size="12">
          YOUR CONTRIBUTION HISTORY WILL APPEAR HERE
        </text>
        </svg>