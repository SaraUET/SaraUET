
    <svg xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         width="1000" height="190"
         viewBox="0 0 1000 190">

    <style>
        
        text { font-family: Poppins, Arial, sans-serif; }
        
        .card {
            opacity: 0;
            animation: appear .9s ease-out
            1.5s forwards;
        }

        .rise {
            opacity: 0;
            animation: rise .8s ease-out
            1.7s forwards;
        }

        @keyframes appear {
            to { opacity: 1; }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .rise {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
        
    </style>

    <defs>
        <linearGradient id="background"
                        x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3d0a1b"/>
            <stop offset="60%" stop-color="#7b1e3a"/>
            <stop offset="100%" stop-color="#b83a5a"/>
        </linearGradient>
    </defs>

    <g class="card">
        <rect width="100%" height="100%"
              rx="22" fill="url(#background)"/>
    </g>
    
    <text x="40" y="42"
          fill="#f6e7e9" font-size="20"
          font-weight="600">
        A YEAR OF MAKING THINGS
    </text>
    
</svg>