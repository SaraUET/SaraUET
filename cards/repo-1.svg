<svg xmlns="http://www.w3.org/2000/svg"
        width="480"
        height="175"
        viewBox="0 0 480 175"
        role="img">

<defs>

  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10030A"/>
    <stop offset=".55" stop-color="#1B0610"/>
    <stop offset="1" stop-color="#31091C"/>
  </linearGradient>

  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7D173B"/>
    <stop offset=".55" stop-color="#D84C80"/>
    <stop offset="1" stop-color="#F3B2CA"/>
  </linearGradient>

  <radialGradient id="mist">
    <stop offset="0" stop-color="#D84C80" stop-opacity=".32"/>
    <stop offset="1" stop-color="#D84C80" stop-opacity="0"/>
  </radialGradient>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="smoke">
    <feGaussianBlur stdDeviation="16"/>
  </filter>

  <pattern id="grid" width="28" height="28"
           patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28"
          fill="none"
          stroke="#D84C80"
          stroke-opacity=".09"/>
  </pattern>

  <style>
    .heading {
      font-family: Georgia, serif;
      fill: #FBEAF1;
    }

    .mono {
      font-family: monospace;
      fill: #F3B2CA;
    }

    .muted {
      font-family: monospace;
      fill: #B9869B;
    }

    .pink {
      fill: #D84C80;
    }

    .line {
      stroke: #D84C80;
      stroke-opacity: .65;
      fill: none;
    }
  </style>

</defs>

<title>CakeBlogSite</title>

<rect width="100%" height="100%" rx="22"
      fill="url(#background)"/>

<rect width="100%" height="100%" rx="22"
      fill="url(#grid)"/>

<!-- ATMOSPHERIC SMOKE -->

<g filter="url(#smoke)" opacity=".55">

  <ellipse cx="8%" cy="15%" rx="20%" ry="28%"
           fill="#7D173B" opacity=".5"/>

  <ellipse cx="90%" cy="80%" rx="24%" ry="30%"
           fill="#D84C80" opacity=".18"/>

</g>

<!-- PINK MIST -->

<ellipse cx="85%" cy="15%" rx="28%" ry="40%"
         fill="url(#mist)"/>

<!-- GLOWING BORDER -->

<rect x="1" y="1"
      width="98%" height="98%"
      rx="21"
      fill="none"
      stroke="#D84C80"
      stroke-opacity=".65"/>

<!-- DECORATIVE STARS -->

<g fill="#F3B2CA" filter="url(#glow)">

  <path d="M88 30l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>

  <path d="M90 75l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>

</g>


    <text x="28" y="38"
          class="pink mono"
          font-size="11"
          letter-spacing="2">
      FEATURED REPOSITORY / 01
    </text>

    <text x="28" y="83"
          class="heading"
          font-size="29">
      CakeBlogSite
    </text>

    <text x="28" y="112"
          class="mono"
          font-size="12">
      A baking-focused web project.
    </text>

    <rect x="28" y="132"
          width="125" height="25"
          rx="13"
          fill="#3C0A1F"
          stroke="#7D173B"/>

    <text x="90" y="149"
          text-anchor="middle"
          class="mono"
          font-size="10">
      HTML / CSS
    </text>

    <text x="430" y="145"
          class="heading"
          font-size="25">↗</text>
    </svg>