
    <svg xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         width="1000" height="250"
         viewBox="0 0 1000 250">

    <style>
        
        text { font-family: Poppins, Arial, sans-serif; }
        
        .card {
            opacity: 0;
            animation: appear .9s ease-out
            0s forwards;
        }

        .rise {
            opacity: 0;
            animation: rise .8s ease-out
            0.2s forwards;
        }

        @keyframes appear {
            to { opacity: 1; }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .rise {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
        
    </style>

    <defs>
        <linearGradient id="background"
                        x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3d0a1b"/>
            <stop offset="60%" stop-color="#7b1e3a"/>
            <stop offset="100%" stop-color="#b83a5a"/>
        </linearGradient>
    </defs>

    <g class="card">
        <rect width="100%" height="100%"
              rx="22" fill="url(#background)"/>
    </g>
    
    <text x="50" y="48"
          fill="#f3dfe3" font-size="14"
          letter-spacing="4" class="rise">
        HELLO, I'M
    </text>

    <text x="48" y="120"
          fill="#f6e7e9" font-size="51"
          font-weight="600" class="rise">
        Sara Shafqat
    </text>

    <text x="50" y="160"
          fill="#f3dfe3" font-size="17"
          class="rise">
        BBIT graduate blending IT, business operations and a designer&#x27;s eye.
    </text>

    <path d="M50 190 H260"
          stroke="#f3dfe3" opacity=".5"/>

    <text x="50" y="220"
          fill="#f3dfe3" font-size="12"
          letter-spacing="2">
        IT · DESIGN · WEB · CREATIVE IDEAS
    </text>

    <circle cx="870" cy="120" r="68"
            fill="none" stroke="#f3dfe3"
            stroke-opacity=".5" stroke-width="2"/>

    <circle cx="870" cy="120" r="53"
            fill="#f3dfe3" fill-opacity=".12"/>

    <text x="870" y="139"
          fill="#f6e7e9" font-size="48"
          text-anchor="middle">
        S.
    </text>
    
</svg>