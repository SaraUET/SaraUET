<svg xmlns="http://www.w3.org/2000/svg" width="236" height="146" viewBox="0 0 236 146" role="img"><title>About me</title><defs><style>
.serif{font-family:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif}
