
    <svg xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         width="1000" height="155"
         viewBox="0 0 1000 155">

    <style>
        
        text { font-family: Poppins, Arial, sans-serif; }
        
        .card {
            opacity: 0;
            animation: appear .9s ease-out
            1.2s forwards;
        }

        .rise {
            opacity: 0;
            animation: rise .8s ease-out
            1.4s forwards;
        }

        @keyframes appear {
            to { opacity: 1; }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .rise {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
        
    </style>

    <defs>
        <linearGradient id="background"
                        x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3d0a1b"/>
            <stop offset="60%" stop-color="#7b1e3a"/>
            <stop offset="100%" stop-color="#b83a5a"/>
        </linearGradient>
    </defs>

    <g class="card">
        <rect width="100%" height="100%"
              rx="22" fill="url(#background)"/>
    </g>
    
    <rect x="1" y="1" width="998" height="153"
          rx="21" fill="#f3dfe3"/>

    <circle cx="65" cy="77" r="31"
            fill="#7b1e3a"/>

    <text x="65" y="85"
          fill="#f6e7e9" font-size="22"
          text-anchor="middle">
        2
    </text>

    <text x="120" y="60"
          fill="#3d0a1b" font-size="22"
          font-weight="600">
        Portfolio
    </text>

    <text x="120" y="89"
          fill="#7b1e3a" font-size="14">
        My personal portfolio and creative work.
    </text>

    <text x="120" y="120"
          fill="#c9a3ad" font-size="12">
        HTML / CSS / JS
    </text>

    <text x="950" y="88"
          fill="#b83a5a" font-size="26"
          text-anchor="middle">
        ↗
    </text>
    
</svg>